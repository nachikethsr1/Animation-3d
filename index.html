   ========================================================================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const Sound=(()=>{
  let ctx=null,master=null,ambGain=null,ambFilter=null,noiseBuf=null,ready=false,muted=false;

    master.connect(comp); comp.connect(ctx.destination);

    const src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    ambFilter=ctx.createBiquadFilter(); ambFilter.type='lowpass'; ambFilter.frequency.value=330; ambFilter.Q.value=.6;

    setMuted(m){muted=m;if(ready)master.gain.setTargetAtTime(m?0:.9,T(),.05);},
    ambience(v){ if(ready)ambGain.gain.setTargetAtTime(muted?0:v,T(),.6); },

/* =========================================================================

   ========================================================================= */
const Speech=(()=>{
  const synth=window.speechSynthesis;

  const MALE=/david|daniel|james|mark|guy|male|alex|fred|george|arthur|edward|liam|noah|william|thomas|ravi|prabhat/i;

    if(!synth||picked)return; const vs=synth.getVoices()||[]; if(!vs.length)return; picked=true;

        ||pool.find(v=>/google|natural|premium|enhanced/i.test(v.name))
        ||pool.find(v=>/us|gb/i.test(v.lang))||pool[0];
  }
  if(synth){ choose(); synth.onvoiceschanged=choose; }
  return{
    get ok(){return ok;}, get voice(){choose();return voice;},
    setMuted(m){ muted=!!m; if(m&&synth)try{synth.cancel();}catch(e){} },
    cancel(){ if(synth)try{synth.cancel();}catch(e){} },
    say(text,{rate=1.12,pitch=.95,onstart,onend,onboundary,onerr}={}){

        synth.speak(u);

    }
  };
})();

const EXPR={
  neutral:{browL:0,browR:0,browY:0,eye:1,mw:.085,mh:.014,mrot:0},
  focused:{browL:.08,browR:-.08,browY:-.006,eye:.94,mw:.07,mh:.012,mrot:0},
  confused:{browL:.30,browR:-.20,browY:.012,eye:1.05,mw:.068,mh:.013,mrot:.30},
  scoff:{browL:-.14,browR:.20,browY:.004,eye:.78,mw:.095,mh:.030,mrot:-.16},
  worried:{browL:-.42,browR:.42,browY:.018,eye:1.14,mw:.062,mh:.012,mrot:.06},
  alert:{browL:-.20,browR:.20,browY:.02,eye:1.28,mw:.058,mh:.014,mrot:0},

function makeHuman(o={}){

  B(.44,.20,.28,pantsM,0,-.05,0,hips,o.shadow,o.shadow);

    B(.05,.16,.03,LM(0xd8dcea),-.07,.55,.16,hips);B(.05,.16,.03,LM(0xd8dcea),.07,.55,.16,hips);

  B(.15,.10,.15,skinM,0,.635,0,hips);
  const headG=new THREE.Group();headG.position.y=.66;hips.add(headG);R.head=headG;
  B(.325,.335,.31,skinM,0,.165,0,headG,o.shadow,o.shadow);
  B(.06,.07,.05,skinM,0,.145,.155,headG);
  if(detail){
    B(.345,.105,.33,hairM,0,.315,-.005,headG,o.shadow);
    B(.345,.075,.07,hairM,0,.278,.152,headG);
    B(.055,.13,.06,hairM,-.163,.235,.02,headG);B(.055,.13,.06,hairM,.163,.235,.02,headG);
    B(.33,.05,.05,hairM,0,.245,-.155,headG);
    // face

    const eyeG=new THREE.BoxGeometry(.055,.062,.016);
    const eL=new THREE.Mesh(eyeG,MAT.eye);eL.position.set(-.073,.196,0);face.add(eL);
    const eR=new THREE.Mesh(eyeG,MAT.eye);eR.position.set(.073,.196,0);face.add(eR);
    const bG=new THREE.BoxGeometry(.075,.016,.014);
    const bL=new THREE.Mesh(bG,hairM);bL.position.set(-.073,.243,.002);face.add(bL);
    const bR=new THREE.Mesh(bG,hairM);bR.position.set(.073,.243,.002);face.add(bR);

    mouth.position.set(0,.088,.004);mouth.scale.set(.085,.014,1);face.add(mouth);
    R.eyes=[eL,eR];R.brows=[bL,bR];R.mouth=mouth;R.eyeBase=.062;
  }
  // arms
  function arm(side){
    const sh=new THREE.Group();sh.position.set(side*.365,.52,0);hips.add(sh);
    B(.155,.31,.155,shirtM,0,-.155,0,sh,o.shadow,o.shadow);
    const el=new THREE.Group();el.position.y=-.31;sh.add(el);
    B(.14,.29,.14,shirtM,0,-.145,0,el,o.shadow,o.shadow);
    B(.125,.09,.125,skinM,0,-.32,0,el);
    const hand=new THREE.Group();hand.position.y=-.34;el.add(hand);
    return{sh,el,hand};
  }
  const A_L=arm(-1),A_R=arm(1);
  R.armLObj=A_L;R.armRObj=A_R;
  // legs (thigh -> knee -> shin -> shoe) : pivot at hips, so legs never enter the chest
  function leg(side){
    const hp=new THREE.Group();hp.position.set(side*.135,-.02,0);hips.add(hp);
    B(.195,.42,.20,pantsM,0,-.21,0,hp,o.shadow,o.shadow);

function setExpr(R,name){ if(EXPR[name])R.expr=name; }

function updateHuman(R,dt,T){
  const P=R.parts;
  // ---- pose targets
  let t={};
  const amp=R.amp;
  if(R.pose==='walk'||R.pose==='run'){
    const run=R.pose==='run';
    const cad=run?11.5:6.2;
    R.prevPhase=R.phase;R.phase+=dt*cad*R.speedMul*(R.moving===false?0:1);
    const p=R.phase,a=(run?.95:.52)*amp;
    t.thL=-Math.sin(p)*a; t.thR=-Math.sin(p+Math.PI)*a;
    t.knL=.14+Math.max(0,Math.sin(p))*(run?.95:.62)*amp;
    t.knR=.14+Math.max(0,Math.sin(p+Math.PI))*(run?.95:.62)*amp;
    t.ftL=-Math.sin(p+.7)*.22*amp; t.ftR=-Math.sin(p+Math.PI+.7)*.22*amp;
    t.shL=Math.sin(p+Math.PI)*(run?.85:.42)*amp; t.shR=Math.sin(p)*(run?.85:.42)*amp;
    t.elL=-(run?1.5:.30)-Math.max(0,Math.sin(p+Math.PI))*(run?.35:.14)*amp;
    t.elR=-(run?1.5:.30)-Math.max(0,Math.sin(p))*(run?.35:.14)*amp;
    t.bob=Math.abs(Math.sin(p))*(run?.055:.022)*amp;
    t.lean=run?.24:.07;
    t.twist=Math.sin(p)*(run?.16:.07)*amp;
    t.sway=Math.sin(p)*.05*amp;
    if(R.onStep){
      const c=Math.floor(R.phase/Math.PI);
      if(c!==R.lastStep){R.lastStep=c;R.onStep(run);}
    }
  }else{
    R.phase=0;
    const sit=R.pose==='sit', lie=R.pose==='lie', slump=R.pose==='slump';
    t.thL=sit?-1.12:(slump?-1.15:0); t.thR=sit?-1.18:(slump?-1.25:0);
    t.knL=sit?1.32:(slump?1.05:.04); t.knR=sit?1.36:(slump?.95:.04);
    t.ftL=sit?-.18:(lie?.2:0); t.ftR=sit?-.15:(lie?-.25:0);
    t.shL=sit?-.10:.05; t.shR=sit?-.10:-.05;
    t.elL=sit?-.22:-.10; t.elR=sit?-.22:-.10;
    t.bob=0;t.lean=sit?.10:(slump?-.30:0);t.twist=0;t.sway=0;
  }
  // arm modes override the right/left arm
  function applyArm(mode,side){
    if(mode==='phone'){ t[side?'shR':'shL']=-1.02; t[side?'elR':'elL']=-1.42; }
    else if(mode==='up'){ t[side?'shR':'shL']=-.55; t[side?'elR':'elL']=-1.15; }
    else if(mode==='reach'){ t[side?'shR':'shL']=-1.28; t[side?'elR':'elL']=-.28; }
    else if(mode==='out'){ t[side?'shR':'shL']=-.15; t[side?'elR':'elL']=-.25; }
    else if(mode==='head'){ t[side?'shR':'shL']=-1.55; t[side?'elR':'elL']=-2.05; }
  }
  applyArm(R.armL,false);applyArm(R.armR,true);

  const lam=R.still?0:9;
  const D=(cur,tgt,l)=>dampF(cur,tgt,l===undefined?lam:l,dt);
  P.L_L.hp.rotation.x=D(P.L_L.hp.rotation.x,t.thL);
  P.L_R.hp.rotation.x=D(P.L_R.hp.rotation.x,t.thR);
  P.L_L.kn.rotation.x=D(P.L_L.kn.rotation.x,t.knL);
  P.L_R.kn.rotation.x=D(P.L_R.kn.rotation.x,t.knR);
  P.L_L.ft.rotation.x=D(P.L_L.ft.rotation.x,t.ftL);
  P.L_R.ft.rotation.x=D(P.L_R.ft.rotation.x,t.ftR);
  P.A_L.sh.rotation.x=D(P.A_L.sh.rotation.x,t.shL);
  P.A_R.sh.rotation.x=D(P.A_R.sh.rotation.x,t.shR);
  P.A_L.sh.rotation.z=D(P.A_L.sh.rotation.z,R.pose==='lie'?.95:(R.pose==='walk'?.07:.11));
  P.A_R.sh.rotation.z=D(P.A_R.sh.rotation.z,R.pose==='lie'?-.95:(R.pose==='walk'?-.07:-.11));
  P.A_L.el.rotation.x=D(P.A_L.el.rotation.x,t.elL);
  P.A_R.el.rotation.x=D(P.A_R.el.rotation.x,t.elR);

  // breathing / life
  const br=R.still?0:Math.sin(T*1.7+R.breath);
  R.hips.position.y=D(R.hips.position.y,HIP+(t.bob||0)+br*.006,14);
  P.torso.rotation.x=D(P.torso.rotation.x,(t.lean||0)+br*.012,8);
  R.hips.rotation.y=D(R.hips.rotation.y,t.twist||0,8);
  R.hips.rotation.z=D(R.hips.rotation.z,t.sway||0,8);
  // head look + expression
  R.head.rotation.y=dampF(R.head.rotation.y,clamp(R.tHeadYaw,-1.05,1.05),R.still?0:7,dt);
  R.head.rotation.x=dampF(R.head.rotation.x,clamp(R.tHeadPitch,-.6,.6),R.still?0:7,dt);
  R.head.rotation.z=dampF(R.head.rotation.z,(R.tilt||0)+br*.008,R.still?0:5,dt);
  if(R.mouth){
    const e=EXPR[R.expr]||EXPR.neutral;
    const bl=R.blink>0?R.blink:1;
    R.mouth.scale.x=dampF(R.mouth.scale.x,e.mw,10,dt);
    R.mouth.scale.y=dampF(R.mouth.scale.y,e.mh,10,dt);
    R.mouth.rotation.z=dampF(R.mouth.rotation.z,e.mrot,10,dt);
    R.eyes[0].scale.y=dampF(R.eyes[0].scale.y,bl,22,dt);
    R.eyes[1].scale.y=R.eyes[0].scale.y;
    R.brows[0].rotation.z=dampF(R.brows[0].rotation.z,-e.browL,10,dt);
    R.brows[1].rotation.z=dampF(R.brows[1].rotation.z,e.browR,10,dt);
    R.brows[0].position.y=dampF(R.brows[0].position.y,.243+e.browY,10,dt);
    R.brows[1].position.y=R.brows[0].position.y;
    if(!R.still){
      R.blinkT-=dt;
      if(R.blinkT<=0){R.blink=.08;R.blinkT=rr(2.2,5.4);}
      if(R.blink>0){R.blink-=dt*7;if(R.blink<0)R.blink=0;}
      R.blinkCurve=R.blinkT<.16?Math.sin((1-R.blinkT/.16)*Math.PI):0;
      R.eyes[0].scale.y=clamp(1-R.blinkCurve,.06,1);
    }
  }
  // root yaw
  R.root.rotation.y=dampF(R.root.rotation.y,R.tYaw,R.still?0:8,dt);
}
function faceTo(R,x,z){ R.tYaw=Math.atan2(x-R.root.position.x,z-R.root.position.z); }

function wrap(ctx,txt,max){
  const words=txt.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

function drawPhone(){

  c.fillStyle='#dfe7f5';c.fillRect(278,16,26,13);c.fillRect(306,20,2,5);

  c.textAlign='left';
  c.strokeStyle='rgba(255,255,255,.10)';c.beginPath();c.moveTo(14,104);c.lineTo(W-14,104);c.stroke();

  let y=128;

    c.fillStyle=isNew?'rgba(120,170,255,'+(.20+PHONE.flash*.5)+')':'rgba(255,255,255,.055)';

  PT.needsUpdate=true;
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

function runner(x,z,dir,sp,detail){
  const h=makeNPC('run',x,0,z,dir>0?Math.PI/2:-Math.PI/2,{detail,speed:1});
  h.runDir=dir;h.runSpeed=sp;h.runZ=z;h.headTurn=rr(0,6);
  runners.push(h);return h;
}

function updateNPCs(dt,T){
  for(const r of runners){
    r.root.position.x+=r.runDir*r.runSpeed*dt;
    if(r.root.position.x>92)r.root.position.x=-92;
    if(r.root.position.x<-92)r.root.position.x=92;
    r.tYaw=r.runDir>0?Math.PI/2:-Math.PI/2;
    r.root.rotation.y=r.tYaw;
    r.moving=true;r.phase+=0;
    r.tHeadYaw=Math.sin(T*.9+r.headTurn)*.55;
    r.tHeadPitch=-.08;
    r.amp=1;
    updateHuman(r,dt,T);
    r.root.position.y=Math.abs(Math.sin(r.phase))*.03;
  }
  for(const n of NPCS){
    if(runners.includes(n))continue;
    if(n===slumped){ n.tHeadPitch=.42+Math.sin(T*.6)*.02; }
  }
}

/* =========================================================================
   10. CAMERA CONTROLLER
   ========================================================================= */
const CAM={
  pos:new THREE.Vector3(14,7.5,30),look:new THREE.Vector3(0,3.2,4),fov:45,
  tpos:new THREE.Vector3(14,7.5,30),tlook:new THREE.Vector3(0,3.2,4),tfov:45,
  snap:true,k:14,shake:0,roll:0,troll:0
};
function setCam(p,l,fov,snap,k){
  CAM.tpos.set(p[0],p[1],p[2]);CAM.tlook.set(l[0],l[1],l[2]);CAM.tfov=fov||45;
  CAM.snap=!!snap;if(k)CAM.k=k;
}
const _q=new THREE.Quaternion(),_v=new THREE.Vector3(),_v2=new THREE.Vector3();
function camToObject(obj,dist,fov,offX,offY,offZ){
  obj.getWorldPosition(_v);
  obj.getWorldQuaternion(_q);
  _v2.set(0,0,1).applyQuaternion(_q);
  CAM.tpos.copy(_v).addScaledVector(_v2,dist);
  if(offX||offY||offZ){
    const rx=new THREE.Vector3(1,0,0).applyQuaternion(_q);
    const ry=new THREE.Vector3(0,1,0).applyQuaternion(_q);
    CAM.tpos.addScaledVector(rx,offX||0).addScaledVector(ry,offY||0);
    if(offZ)CAM.tpos.z+=offZ;
  }
  CAM.tlook.copy(_v);CAM.tfov=fov||40;CAM.snap=false;CAM.k=26;
}
function updateCam(dt,T){
  if(CAM.snap){CAM.pos.copy(CAM.tpos);CAM.look.copy(CAM.tlook);CAM.fov=CAM.tfov;CAM.snap=false;}
  else{
    const k=CAM.k;
    CAM.pos.x=dampF(CAM.pos.x,CAM.tpos.x,k,dt);CAM.pos.y=dampF(CAM.pos.y,CAM.tpos.y,k,dt);CAM.pos.z=dampF(CAM.pos.z,CAM.tpos.z,k,dt);
    CAM.look.x=dampF(CAM.look.x,CAM.tlook.x,k,dt);CAM.look.y=dampF(CAM.look.y,CAM.tlook.y,k,dt);CAM.look.z=dampF(CAM.look.z,CAM.tlook.z,k,dt);
    CAM.fov=dampF(CAM.fov,CAM.tfov,10,dt);
  }
  CAM.roll=dampF(CAM.roll,CAM.troll,7,dt);
  const s=CAM.shake;
  camera.position.set(
    CAM.pos.x+Math.sin(T*23.7)*s+Math.sin(T*7.3)*s*.6,
    CAM.pos.y+Math.sin(T*19.1+1.3)*s*.8,
    CAM.pos.z+Math.sin(T*17.3+2.1)*s*.6);
  camera.up.set(Math.sin(CAM.roll),Math.cos(CAM.roll),0);
  camera.lookAt(CAM.look);
  if(Math.abs(camera.fov-CAM.fov)>.01){camera.fov=CAM.fov;camera.updateProjectionMatrix();}
}

/* =========================================================================
   11. HELPERS FOR SHOTS
   ========================================================================= */
const P_HEAD=V3(0,0,0);
function headPos(R,out){ R.head.getWorldPosition(out||P_HEAD); out=out||P_HEAD; out.y+=.16; return out; }
const _h=new THREE.Vector3();
function faceCam(R,dist,fov,side,up){
  headPos(R,_h);
  const yaw=R.root.rotation.y+R.head.rotation.y;
  const dir=V3(Math.sin(yaw),0,Math.cos(yaw));
  const right=V3(dir.z,0,-dir.x);
  const p=_h.clone().addScaledVector(dir,dist).addScaledVector(right,side||0).add(V3(0,up||0,0));
  setCam([p.x,p.y,p.z],[_h.x,_h.y-.03,_h.z],fov,false,18);
  return _h.clone();
}
function moveRig(R,x,y,z,yaw){
  R.root.position.set(x,y,z);R.tYaw=yaw;R.root.rotation.y=yaw;
}
function lerpPos(R,ax,ay,az,bx,by,bz,t){
  R.root.position.set(lerp(ax,bx,t),lerp(ay,by,t),lerp(az,bz,t));
}

  const p=_h.clone().add(V3(.42,.05,.62));
  setCam([p.x,p.y,p.z],[_h.x,_h.y-.02,_h.z],lerp(35,30,k),false,12);
  CAM.shake=lerp(.0018,.0042,k);
  alex.hips.position.y=HIP+Math.sin(clamp(t*3,0,Math.PI))*.012;
});

/* ---------- SCENE 7 : THE DOUBLE ---------- */
shot(7,1.35,()=>{ dbl.root.visible=true;Sound.revealHit(); },(t,d)=>{

  CAM.troll=Math.sin(a)*.05;
});

},(t,d)=>{

shot(7,1.4,()=>{ Sound.tick(); },(t,d)=>{
  const k=clamp(t/d,0,1);
  const hp=V3(-4.15,1.72,2.75);
  setCam([hp.x+.16,hp.y+.02,hp.z+lerp(.86,.70,k)],[hp.x,hp.y-.01,hp.z],lerp(31,27,k),false,9);
  CAM.shake=.0012;
  dbl.tHeadYaw=Math.sin(t*.4)*.006;
});
shot(7,1.05,()=>{ },(t,d)=>{
  const k=clamp(t/d,0,1);
  headPos(alex,_h);
  setCam([_h.x+.34,_h.y+.04,_h.z+.66],[_h.x,_h.y,_h.z],lerp(33,29,k),false,12);

/* scene index -> first shot index & totals */
const SCENE_FIRST={},SCENE_LAST={},SCENE_DUR={};
S.forEach((sh,i)=>{
  if(SCENE_FIRST[sh.s]===undefined)SCENE_FIRST[sh.s]=i;
  SCENE_LAST[sh.s]=i;
  SCENE_DUR[sh.s]=(SCENE_DUR[sh.s]||0)+sh.dur;
});
const TOTAL_DUR=S.reduce((a,s)=>a+s.dur,0)+1.2;

/* =========================================================================
   13. SUBTITLES
   ========================================================================= */
const subEl=document.getElementById('subsText');
const subsEl=document.getElementById('subs');
let curCue=-1,curScene=-1;
function showCue(i){
  if(i===curCue)return;curCue=i;
  if(i<0||i>=SCENES[curScene]?.cues?.length){subEl.textContent='';subEl.classList.remove('in');return;}
  subEl.textContent=SCENES[curScene].cues[i].text;
  subEl.classList.remove('in');void subEl.offsetWidth;subEl.classList.add('in');
}
function cueByChar(si,ch){
  const cues=SCENES[si].cues;
  for(let i=0;i<cues.length;i++)if(ch>=cues[i].a&&ch<cues[i].b)return i;
  for(let i=cues.length-1;i>=0;i--)if(ch>=cues[i].a)return i;
  return 0;
}
function cueByTime(si,el){
  const s=SCENES[si],dur=s.spokenDur||s.est||1;
  const scale=dur/s.text.length;
  let acc=0;
  for(let i=0;i<s.cues.length;i++){
    const len=s.cues[i].text.length;
    const t0=acc*scale,t1=(acc+len)*scale;
    if(el>=t0&&el<t1)return i;
    acc+=len+1;
  }
  return el<dur?s.cues.length-1:-1;
}
function speakScene(i){
  const s=SCENES[i];curScene=i;curCue=-1;s.spoken=false;s.useBoundary=false;s.done=false;s.silent=false;
  s.speechStart=playTime;s.spokenDur=s.est;
  if(!Speech.ok){
    // No speech synthesis available: spread the cues across the scene's own shot
    // length and let the timeline run normally instead of waiting for narration.
    s.silent=true;s.spoken=true;s.spokenDur=SCENE_DUR[i+1]||s.est;return;
  }
  const chunks=chunkText(s.text);
  let ended=0;
  chunks.forEach((ch,k)=>{
    const base=ch.start;
    Speech.say(ch.text,{rate:1.12,pitch:.95,
      onstart:()=>{ if(k===0){s.speechStart=playTime;s.spoken=true;} },
      onboundary:(ci)=>{ s.useBoundary=true; showCue(cueByChar(i,base+ci)); },
      onend:()=>{ ended++;
        if(ended>=chunks.length){ s.spokenDur=Math.max(.6,playTime-s.speechStart); s.done=true; showCue(-1); } },
      onerr:()=>{ s.done=true; }
    });
  });
}

/* =========================================================================
   14. PLAYBACK CONTROL
   ========================================================================= */
let playing=false,playTime=0,shotIdx=-1,shotStart=0,finished=false;
const blackEl=document.getElementById('black');
const peepEl=document.getElementById('peep');
const progFill=document.getElementById('progFill');
const replayEl=document.getElementById('replay');

function startShot(i){
  shotIdx=i;shotStart=playTime;
  const sh=S[i];
  CAM.shake=0;CAM.troll=0;
  if(sh.s!==0&&SCENE_FIRST[sh.s]===i){ speakScene(sh.s-1); }
  if(sh.enter)sh.enter();
}
function finish(){
  if(finished)return;finished=true;playing=false;
  Sound.duck();Speech.cancel();
  blackEl.classList.add('on');showCue(-1);
  setTimeout(()=>{replayEl.classList.add('on');},650);
}
function resetAll(){
  Speech.cancel();
  finished=false;playing=false;playTime=0;shotIdx=-1;shotStart=0;curCue=-1;curScene=-1;
  blackEl.classList.remove('on');peepEl.classList.remove('on');replayEl.classList.remove('on');
  subEl.textContent='';progFill.style.width='0%';
  PHONE.msgs=[];PHONE.flash=0;setPhoneTime('11:41');drawPhone();drawClock('11:41');clockState.txt='11:41';
  HOUSE.door.position.set(-1.6,0,HOUSE.doorBaseZ);HOUSE.door.rotation.z=0;
  dbl.root.visible=false;alex.root.visible=false;doorShake=0;
  SCENES.forEach(s=>{s.done=true;s.spoken=false;s.useBoundary=false;});
  setExpr(alex,'focused');alex.pose='sit';alex.amp=1;
  moveRig(alex,3.4,2.98,3.35,Math.PI);
  CAM.snap=true;setCam([17,8.4,33],[0,3.4,3],48,true);
}
function play(){
  resetAll();
  Sound.init();Sound.resume();Sound.ambience(.15);
  playing=true;
  startShot(0);
}

/* director update with narration gating */
let holdScene=-1;
const MAX_HOLD=2.4;   // seconds a shot may be held on its last frame waiting for narration
function updateDirector(dt){
  if(!playing||finished)return;
  playTime+=dt;
  const sh=S[shotIdx];if(!sh)return;
  let lt=playTime-shotStart;
  if(sh.upd)sh.upd(Math.min(lt,sh.dur),sh.dur);
  // silent mode: the cue clock is the scene's shot length, so close the scene when it elapses
  const curScn=SCENES[sh.s-1];
  if(curScn&&curScn.silent&&!curScn.done&&playTime-curScn.speechStart>=curScn.spokenDur){
    curScn.done=true;showCue(-1);
  }
  if(lt>=sh.dur){
    const next=shotIdx+1;
    if(next>=S.length){finish();return;}
    if(S[next].s!==sh.s){
      const si=sh.s-1;
      const scn=SCENES[si];
      let done=scn?scn.done:true;
      if(scn&&!scn.done){
        // watchdog, plus a hard cap on how long a shot may be held for narration
        const over=playTime-shotStart-sh.dur;
        if(playTime-scn.speechStart>scn.est*1.9+3.5||over>MAX_HOLD){
          // give up on the narration instead of freezing the picture, and drop the
          // rest of it so the next scene's voice starts in sync with the visuals
          scn.done=true;done=true;showCue(-1);
          if(!scn.silent)Speech.cancel();
        }
      }
      if(!done){ // hold on this shot until narration finishes
        sh.upd&&sh.upd(sh.dur,sh.dur);
        if(scn&&scn.spoken&&!scn.useBoundary)showCue(cueByTime(si,playTime-scn.speechStart));
        return;
      }
    }
    startShot(next);
  }else{
    const si=sh.s-1;const scn=SCENES[si];
    if(scn&&scn.spoken&&!scn.useBoundary&&!scn.done)showCue(cueByTime(si,playTime-scn.speechStart));
  }
  progFill.style.width=clamp(Math.min(playTime/TOTAL_DUR,finished?1:.985)*100,0,100)+'%';
}

/* =========================================================================
   15. LAYOUT / FULLSCREEN / UI
   ========================================================================= */
function layout(){
  const vw=window.innerWidth,vh=window.innerHeight;
  let w=vw,h=vw*16/9;
  if(h>vh){h=vh;w=vh*9/16;}
  w=Math.max(200,Math.round(w));h=Math.max(200,Math.round(h));
  frameEl.style.width=w+'px';frameEl.style.height=h+'px';
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  subEl.style.fontSize=Math.round(w*.060)+'px';
  subsEl.style.bottom=Math.round(h*.155)+'px';
}
window.addEventListener('resize',layout);
layout();

const ui=document.getElementById('ui');
let uiT=0;
function wakeUI(){ui.classList.remove('hide');uiT=2.6;}
['mousemove','touchstart','keydown'].forEach(e=>window.addEventListener(e,wakeUI,{passive:true}));

document.getElementById('bFull').addEventListener('click',()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
  else document.exitFullscreen&&document.exitFullscreen();
  setTimeout(layout,120);
});
document.addEventListener('fullscreenchange',()=>setTimeout(layout,120));
let muted=false;
const bSound=document.getElementById('bSound');
bSound.addEventListener('click',()=>{
  muted=!muted;bSound.classList.toggle('off',muted);
  Sound.setMuted(muted);
  if(muted)Speech.cancel();
});
document.getElementById('bReplay').addEventListener('click',()=>{play();wakeUI();});
document.getElementById('replayBtn').addEventListener('click',()=>{play();wakeUI();});
document.getElementById('play').addEventListener('click',()=>{
  document.getElementById('intro').classList.add('gone');
  const el=document.documentElement;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rq){ try{ const p=rq.call(el); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
  setTimeout(()=>{layout();play();},90);
  wakeUI();
});

/* grain texture */
(function grain(){
  const c=document.createElement('canvas');c.width=c.height=110;const x=c.getContext('2d');
  const d=x.createImageData(110,110);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=26;}
  x.putImageData(d,0,0);
  document.getElementById('grain').style.backgroundImage='url('+c.toDataURL()+')';
})();

/* =========================================================================
   16. MAIN LOOP
   ========================================================================= */
const clock=new THREE.Clock();
let W=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  W+=dt;
  updateDirector(dt);
  // characters
  updateHuman(alex,dt,W);
  if(dbl.root.visible)updateHuman(dbl,dt,W);
  updateNPCs(dt,W);
  slumped.tHeadPitch=.42+Math.sin(W*.6)*.02;
  watcher.tHeadYaw=Math.sin(W*.22)*.10;
  // lamp flicker + fires
  const fl=.85+Math.sin(W*13.1)*.06+Math.sin(W*3.7)*.09;
  nearLamp.intensity=2.4*fl;nearLamp2.intensity=1.7*(2-fl);
  bedLamp.intensity=2.5*(.94+Math.sin(W*2.1)*.06);
  hallLamp.intensity=1.9*(.95+Math.sin(W*3.3)*.05);
  phoneLight.intensity=.5+PHONE.flash*.5;
  if(PHONE.flash>0){PHONE.flash=Math.max(0,PHONE.flash-dt*1.6);}
  updateCam(dt,W);
  renderer.render(scene,camera);
}

/* idle preview before play */
alex.root.visible=false;dbl.root.visible=false;
setCam([17,8.4,33],[0,3.4,3],48,true);CAM.snap=true;
loop();
wakeUI();
const errEl=document.getElementById('err');
if(errEl){errEl.style.display='none';errEl.textContent='';}
window.__booted=true;
</script>
