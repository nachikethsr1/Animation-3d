<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--sw,360px);height:var(--sh,640px);background:#05070b;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ovl{position:absolute;inset:0;pointer-events:none}
#grade{background:linear-gradient(180deg,rgba(46,86,138,.30) 0%,rgba(12,22,38,.10) 45%,rgba(6,12,22,.46) 100%);
  mix-blend-mode:multiply;opacity:0}
#cool{background:radial-gradient(120% 90% at 50% 30%,rgba(90,140,200,.10),rgba(20,40,70,.30) 70%);opacity:0}
#vig{background:radial-gradient(115% 78% at 50% 44%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
#grain{opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation:gr .45s steps(3) infinite}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-2%,1.5%)}66%{transform:translate(1.5%,-2%)}100%{transform:translate(0,0)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* ---------- SUBTITLES ---------- */
#subs{position:absolute;left:5%;right:5%;bottom:15.5%;display:flex;justify-content:center;pointer-events:none;z-index:6}
#subsText{max-width:100%;font-weight:800;font-size:calc(var(--sw,360px) * .062);line-height:1.2;color:#fff;
  text-align:center;letter-spacing:.2px;opacity:0;transform:translateY(12px) scale(.97);
  transition:opacity .16s ease,transform .24s cubic-bezier(.2,.9,.2,1);
  text-shadow:0 0 4px #000,2px 2px 0 rgba(0,0,0,.95),-2px 2px 0 rgba(0,0,0,.95),2px -2px 0 rgba(0,0,0,.95),
  -2px -2px 0 rgba(0,0,0,.95),0 6px 20px rgba(0,0,0,.8)}
#subsText.show{opacity:1;transform:translateY(0) scale(1)}
#subsText.em{font-size:calc(var(--sw,360px) * .072);letter-spacing:.4px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;
  padding:0 12px 8px;z-index:9;opacity:0;transition:opacity .35s ease;pointer-events:none}
#hud.on{opacity:1;pointer-events:auto}
#hud button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:rgba(10,16,26,.55);color:#fff;font-size:14px;line-height:1;cursor:pointer;backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;transition:.18s}
#hud button:hover{background:rgba(90,150,220,.45);transform:scale(1.07)}
#tcode{margin-left:auto;font-weight:600;font-size:11px;color:rgba(255,255,255,.72);letter-spacing:.6px;
  text-shadow:0 1px 3px #000}
#bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14);z-index:10;cursor:pointer}
#barFill{height:100%;width:0%;background:linear-gradient(90deg,#6fb4ff,#dff0ff);box-shadow:0 0 8px rgba(120,180,255,.8)}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(90% 70% at 50% 35%,#16233a 0%,#070a11 60%,#000 100%);transition:opacity .5s ease}
#gate.hide{opacity:0;pointer-events:none}
.gw{width:min(92vw,430px);text-align:center;padding:24px}
.gk{font-weight:600;font-size:11px;letter-spacing:4.5px;color:#7fb2e8;opacity:.85;margin-bottom:16px}
.gw h1{font-weight:800;font-size:clamp(26px,7.6vw,40px);line-height:1.06;color:#fff;letter-spacing:-.5px;
  text-shadow:0 8px 40px rgba(60,130,220,.35)}
.gw h1 span{color:#8fc4ff;text-shadow:0 0 26px rgba(120,190,255,.75)}
.gline{height:1px;background:linear-gradient(90deg,transparent,rgba(140,190,255,.5),transparent);margin:22px 0}
.gp{font-weight:600;font-size:12.5px;line-height:1.65;color:rgba(220,232,248,.62)}
#btnStart{margin-top:24px;width:100%;padding:16px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#5aa6ff,#2f6fd0);color:#fff;font-family:inherit;font-weight:800;font-size:15px;
  letter-spacing:2.4px;box-shadow:0 12px 34px rgba(50,120,220,.42),inset 0 1px 0 rgba(255,255,255,.35);transition:.18s}
#btnStart:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(60,140,240,.55)}
.gnote{margin-top:14px;font-size:10.5px;letter-spacing:1.6px;color:rgba(200,220,245,.42);font-weight:600}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;
  font-size:14px;text-align:center;padding:30px;z-index:99;background:#0a0d14}
</style>

<div id="stage">

<script type="module">
import * as THREE from 'three';

/* =========================================================================
   0. UTILITIES
   ========================================================================= */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=t=>t*t*(3-2*t);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeO=t=>1-Math.pow(1-t,3);
let _sd=987654321;
const sr=()=>{_sd=(_sd*1664525+1013904223)%4294967296;return _sd/4294967296;};
const rr=(a,b)=>a+sr()*(b-a);
const V3=(a)=>new THREE.Vector3(a[0],a[1],a[2]);

const DUR=48.0, FREEZE=3.2, REV=42.8, FLASHT=47.12, BLACKT=47.26;

/* =========================================================================
   1. RENDERER / SCENE / CAMERA
   ========================================================================= */
const stage=document.getElementById('stage');
const canvas=document.getElementById('c');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',stencil:false});
}catch(e){document.getElementById('fatal').style.display='flex';throw e;}
const isMobile=Math.min(innerWidth,innerHeight)<620||/Mobi|Android/i.test(navigator.userAgent);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isMobile?1.4:2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xa9bccd,0.0052);
const camera=new THREE.PerspectiveCamera(46,9/16,0.08,1400);
scene.add(camera);

const shadowSize=isMobile?1024:2048;
const sun=new THREE.DirectionalLight(0xfff0d8,1.18);
sun.castShadow=true;
sun.shadow.mapSize.set(shadowSize,shadowSize);
sun.shadow.camera.near=1;sun.shadow.camera.far=170;
const SH=27;
sun.shadow.camera.left=-SH;sun.shadow.camera.right=SH;sun.shadow.camera.top=SH;sun.shadow.camera.bottom=-SH;
sun.shadow.bias=-0.0011;sun.shadow.normalBias=0.026;
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xbcd6f5,0.30);fill.position.set(-24,18,-30);scene.add(fill);
const hemi=new THREE.HemisphereLight(0xc3dcf5,0x4a4b45,0.62);scene.add(hemi);
const revealLight=new THREE.PointLight(0xdfeeff,0,16,2.0);revealLight.position.set(7.8,3.4,38.2);scene.add(revealLight);

/* ---------- sky dome ---------- */
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
const skyTex=canvasTex(8,256,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#2b4a72');g.addColorStop(.42,'#6f92b6');g.addColorStop(.72,'#b9cddb');g.addColorStop(1,'#dfe6e8');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
const skyMat=new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false,depthWrite:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(620,26,18),skyMat);
sky.frustumCulled=false;scene.add(sky);

/* =========================================================================
   2. GEOMETRY / MATERIAL HELPERS
   ========================================================================= */
const GC=new Map();
const gBox=(k,a,b,c)=>{if(!GC.has(k))GC.set(k,new THREE.BoxGeometry(a,b,c));return GC.get(k);};
const gCyl=(k,rt,rb,h,s)=>{if(!GC.has(k))GC.set(k,new THREE.CylinderGeometry(rt,rb,h,s));return GC.get(k);};
const gSph=(k,r,a,b)=>{if(!GC.has(k))GC.set(k,new THREE.SphereGeometry(r,a,b));return GC.get(k);};
const gIco=(k,r,d)=>{if(!GC.has(k))GC.set(k,new THREE.IcosahedronGeometry(r,d));return GC.get(k);};
const gCone=(k,r,h,s)=>{if(!GC.has(k))GC.set(k,new THREE.ConeGeometry(r,h,s));return GC.get(k);};
const gPlane=(k,a,b)=>{if(!GC.has(k))GC.set(k,new THREE.PlaneGeometry(a,b));return GC.get(k);};
const gTorus=(k,r,t,a,b)=>{if(!GC.has(k))GC.set(k,new THREE.TorusGeometry(r,t,a,b));return GC.get(k);};

function std(hex,o={}){
  return new THREE.MeshStandardMaterial({color:hex,roughness:o.r??0.86,metalness:o.m??0.02,
    flatShading:o.flat??true,emissive:o.e??0x000000,emissiveIntensity:o.ei??1,
    transparent:!!o.op,opacity:o.op??1,side:o.side??THREE.FrontSide,fog:o.fog??true});
}
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o;}

/* facade texture */
function facadeTex(base,winA,winB,lit){
  return canvasTex(128,128,(x,w,h)=>{
    x.fillStyle=base;x.fillRect(0,0,w,h);
    const cols=4,rows=4,pad=9,cw=(w-pad*2)/cols,ch=(h-pad*2)/rows;
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
      const l=Math.random()<lit;
      x.fillStyle=l?winA:winB;
      x.fillRect(pad+i*cw+2,pad+j*ch+2,cw-5,ch-6);
      x.fillStyle='rgba(0,0,0,.22)';
      x.fillRect(pad+i*cw+2,pad+j*ch+ch-6,cw-5,2);
    }
    x.fillStyle='rgba(0,0,0,.14)';
    for(let i=0;i<cols;i++)x.fillRect(pad+i*cw-2,0,2,h);
  });
}
const facades=[
  {t:facadeTex('#5a6472','#ffe6ae','#20293a',.30),c:0x6b7686},
  {t:facadeTex('#6d6157','#ffe0b0','#241f1d',.22),c:0x7d7166},
  {t:facadeTex('#4b5563','#cfe8ff','#1b222c',.38),c:0x59636f},
  {t:facadeTex('#7a7f86','#ffdca8','#25282e',.18),c:0x848a92},
  {t:facadeTex('#3f4a58','#bfe0ff','#161c26',.44),c:0x4a5563}
];
const facadeMats=facades.map(f=>new THREE.MeshStandardMaterial({map:f.t,color:0xffffff,roughness:.92,metalness:.03,flatShading:false}));
const roofMat=std(0x39414c,{r:.95});

function boxUV(geo,w,h,d){
  const uv=geo.attributes.uv,SU=4.2,SV=3.6;
  const sc=(i0,i1,ru,rv)=>{for(let i=i0;i<i1;i++)uv.setXY(i,uv.getX(i)*ru,uv.getY(i)*rv);};
  sc(0,4,d/SU,h/SV);sc(4,8,d/SU,h/SV);sc(8,12,w/SU,d/SV);sc(12,16,w/SU,d/SV);
  sc(16,20,w/SU,h/SV);sc(20,24,w/SU,h/SV);uv.needsUpdate=true;
}

/* =========================================================================
   3. CITY / ENVIRONMENT
   ========================================================================= */
const ROADY=0.10, CROSSY=0.104, WALKY=0.17;
const CROSSZ=[-76,-46,-16,14,34,54];
const cityRoot=new THREE.Group();scene.add(cityRoot);

const asphalt=std(0x2b2e34,{r:.96,flat:false});
const asphalt2=std(0x2f3239,{r:.96,flat:false});
const paving=std(0x767c85,{r:.94,flat:false});
const paving2=std(0x6a7079,{r:.94,flat:false});
const grass=std(0x3d4a35,{r:1,flat:false});

function slab(x,z,w,d,h,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,h/2,z);m.receiveShadow=true;cityRoot.add(m);return m;
}
/* ground + grass */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),grass);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

/* roads */
slab(0,0,14,340,ROADY,asphalt);                                  // avenue (runs along Z)
CROSSZ.forEach(c=>slab(0,c,190,12,CROSSY,asphalt2));             // cross streets

/* block paving */
const blocks=[];
for(let i=0;i<CROSSZ.length-1;i++)blocks.push([CROSSZ[i]+6.4,CROSSZ[i+1]-6.4]);
blocks.push([-124,CROSSZ[0]-6.4]);blocks.push([CROSSZ[CROSSZ.length-1]+6.4,124]);
blocks.forEach(([za,zb])=>{
  const d=zb-za,cz=(za+zb)/2;
  slab(18.6,cz,24.4,d,WALKY,paving);
  slab(-18.6,cz,24.4,d,WALKY,paving2);
});
/* cross-street sidewalks (outside avenue) */
CROSSZ.forEach(c=>{
  [c+7.8,c-7.8].forEach(z=>{slab(46,z,72,3.6,WALKY,paving);slab(-46,z,72,3.6,WALKY,paving2);});
});

/* lane markings — one instanced mesh */
(function markings(){
  const g=new THREE.BoxGeometry(1,1,1);
  const m=std(0xd8dde2,{r:.7,flat:false});
  const list=[];
  for(let z=-160;z<160;z+=7){
    let skip=false;CROSSZ.forEach(c=>{if(Math.abs(z-c)<9)skip=true;});
    if(!skip)list.push({p:[0,ROADY+.012,z],s:[.20,.02,3.4]});
  }
  [-6.4,6.4].forEach(x=>{for(let z=-160;z<160;z+=4){
    let skip=false;CROSSZ.forEach(c=>{if(Math.abs(z-c)<8)skip=true;});
    if(!skip)list.push({p:[x,ROADY+.012,z],s:[.14,.02,2.2]});}});
  CROSSZ.forEach(c=>{ // crosswalks
    for(let i=-3;i<=3;i++){
      list.push({p:[i*1.9,CROSSY+.012,c+5.2],s:[.9,.02,2.4]});
      list.push({p:[i*1.9,CROSSY+.012,c-5.2],s:[.9,.02,2.4]});
    }
    list.push({p:[0,CROSSY+.012,c+6.6],s:[13,.02,.5]});
  });
  const im=new THREE.InstancedMesh(g,m,list.length);
  const d=new THREE.Object3D();
  list.forEach((o,i)=>{d.position.set(...o.p);d.scale.set(...o.s);d.rotation.set(0,0,0);d.updateMatrix();im.setMatrixAt(i,d.matrix);});
  im.receiveShadow=true;im.instanceMatrix.needsUpdate=true;cityRoot.add(im);
})();

/* buildings */
const buildings=[];
function addBuilding(x,z,w,h,d,matI){
  const g=new THREE.BoxGeometry(w,h,d);boxUV(g,w,h,d);
  const m=new THREE.Mesh(g,facadeMats[matI%facadeMats.length]);
  m.position.set(x,WALKY+h/2,z);m.castShadow=true;m.receiveShadow=true;cityRoot.add(m);
  const cap=new THREE.Mesh(gBox('cap',1,1,1),roofMat);
  cap.scale.set(w*.72,.5,d*.72);cap.position.set(x,WALKY+h+.25,z);cap.castShadow=true;cityRoot.add(cap);
  buildings.push(m);
  return m;
}
let bIdx=0;
blocks.forEach(([za,zb])=>{
  [1,-1].forEach(side=>{
    let z=za+1.2;
    while(z<zb-6){
      const dd=Math.min(rr(9,17),zb-z-1.4);
      if(dd<5.5)break;
      const w=rr(9.5,13.5),h=rr(9,36);
      addBuilding(side*(11.4+w/2),z+dd/2,w,h,dd,bIdx++);
      z+=dd+rr(1.6,4.2);
    }
  });
});
/* west park block (grass + trees instead of buildings) */
(function park(){
  const p=slab(-18.6,-1,24.4,17,.185,std(0x41523a,{r:1,flat:false}));
  cityRoot.add(p);
})();

/* distant skyline */
(function skyline(){
  const g=new THREE.BoxGeometry(1,1,1);
  const m=std(0x54687e,{r:1,flat:false});
  const N=70,im=new THREE.InstancedMesh(g,m,N),d=new THREE.Object3D(),col=new THREE.Color();
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2+rr(-.05,.05),R=rr(165,275);
    const h=rr(24,86),w=rr(14,30);
    d.position.set(Math.cos(a)*R,h/2,Math.sin(a)*R);
    d.scale.set(w,h,w*rr(.7,1.2));d.rotation.y=rr(0,3);d.updateMatrix();im.setMatrixAt(i,d.matrix);
    col.setHSL(.58,rr(.10,.22),rr(.28,.42));im.setColorAt(i,col);
  }
  im.instanceMatrix.needsUpdate=true;cityRoot.add(im);
})();

/* houses (residential ring) — instanced */
const housePos=[];
(function houses(){
  const body=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),std(0xffffff,{r:.9,flat:false}),64);
  const roof=new THREE.InstancedMesh(gCone('roof',.78,.62,4),std(0xffffff,{r:.92,flat:false}),64);
  const d=new THREE.Object3D(),col=new THREE.Color();let n=0;
  const bodyCols=[0xd9cfc0,0xc6b7a4,0xb9c3cb,0xd7c3ab,0xaeb6a8,0xcdbfae];
  const roofCols=[0x6d4b3c,0x4a5560,0x7a5a45,0x3f4a52,0x8a6a52];
  for(let z=-104;z<=104&&n<64;z+=24){
    [1,-1].forEach(side=>{
      if(n>=64)return;
      const x=side*rr(38,56),zz=z+rr(-6,6);
      const w=rr(7,10),h=rr(4.6,6.4),dp=rr(7,10);
      d.position.set(x,WALKY+h/2,zz);d.scale.set(w,h,dp);d.rotation.set(0,0,0);d.updateMatrix();
      body.setMatrixAt(n,d.matrix);col.setHex(bodyCols[(Math.random()*bodyCols.length)|0]);body.setColorAt(n,col);
      d.position.set(x,WALKY+h+.02,zz);d.scale.set(w*1.16,rr(2.6,3.6),dp*1.16);d.rotation.y=Math.PI/4;d.updateMatrix();
      roof.setMatrixAt(n,d.matrix);col.setHex(roofCols[(Math.random()*roofCols.length)|0]);roof.setColorAt(n,col);
      housePos.push([x,zz]);n++;
    });
  }
  body.count=n;roof.count=n;body.castShadow=roof.castShadow=true;body.receiveShadow=roof.receiveShadow=true;
  body.instanceMatrix.needsUpdate=true;roof.instanceMatrix.needsUpdate=true;
  cityRoot.add(body);cityRoot.add(roof);
})();

/* trees — instanced */
const treeSpots=[];
(function buildTrees(){
  blocks.forEach(([za,zb])=>{[1,-1].forEach(s=>{
    for(let z=za+3;z<zb-2;z+=rr(11,17))treeSpots.push([s*9.0,z,rr(.85,1.25)]);
  });});
  housePos.forEach(([x,z])=>{for(let i=0;i<2;i++)treeSpots.push([x+rr(-13,13),z+rr(-13,13),rr(.9,1.5)]);});

/* ---------- posing ---------- */
function applyArm(rig,side,a,w){
  const p=rig.p,sh=side<0?p.shL:p.shR,el=side<0?p.elL:p.elR;
  const t=side<0?a.L:a.R, e=side<0?a.Le:a.Re;
  sh.rotation.x=lerp(sh.rotation.x,t[0],w);
  sh.rotation.y=lerp(sh.rotation.y,t[1],w);
  sh.rotation.z=lerp(sh.rotation.z,t[2]+side*rig.base.shZ*(1-w*.6),w);
  el.rotation.x=lerp(el.rotation.x,e[0],w);
  el.rotation.y=lerp(el.rotation.y,e[1],w);
  el.rotation.z=lerp(el.rotation.z,e[2],w);
}
function poseRig(R,S,tt){
  const p=R.p;
  const sp=S.speed||0,ph=S.phase||0;
  const mv=clamp(sp/5.2,0,1), moving=sp>.12?1:0;
  const hipA=(.10+.52*Math.pow(mv,.72))*moving;
  const kneeA=(.30+.72*mv)*moving;
  const armA=(.12+.60*mv)*moving;
  const bob=(.008+.052*mv)*moving;
  const lean=(S.lean!=null?S.lean:(.035+.24*mv)*moving);
  const s=Math.sin(ph),c=Math.cos(ph);

  p.pelvis.position.y=R.base.pelvisY-(S.crouch||0)*.30+bob*Math.abs(Math.cos(ph))*moving
    +Math.sin(tt*1.7)*.006*(1-moving);
  p.pelvis.rotation.y=-s*.075*moving;
  p.pelvis.rotation.x=lean*.35;
  p.spine.rotation.x=lean;
  p.spine.rotation.y=s*.10*moving;
  p.spine.rotation.z=Math.sin(tt*1.3)*.012*(1-moving);

  p.hpL.rotation.x=-s*hipA;
  p.hpR.rotation.x= s*hipA;
  p.hpL.rotation.z=lerp(p.hpL.rotation.z,-.05+(S.crouch||0)*.42,.3);
  p.hpR.rotation.z=lerp(p.hpR.rotation.z, .05-(S.crouch||0)*.42,.3);
  p.knL.rotation.x=Math.max(0,s)*kneeA+.04+(S.crouch||0)*1.35;
  p.knR.rotation.x=Math.max(0,-s)*kneeA+.04+(S.crouch||0)*1.35;
  p.anL.rotation.x=-Math.max(0,-s)*.32*hipA-(S.crouch||0)*.3;
  p.anR.rotation.x=-Math.max(0,s)*.32*hipA-(S.crouch||0)*.3;

  /* arms: gait base, then pose override blend */
  const aw=S.armW==null?1:S.armW;
  p.shL.rotation.x=lerp(p.shL.rotation.x, s*armA,.55);
  p.shR.rotation.x=lerp(p.shR.rotation.x,-s*armA,.55);
  p.shL.rotation.z=lerp(p.shL.rotation.z,-rig_sh(R)-.06*mv,.3);
  p.shR.rotation.z=lerp(p.shR.rotation.z, rig_sh(R)+.06*mv,.3);
  p.elL.rotation.x=lerp(p.elL.rotation.x,-(.20+.85*mv)*moving-.10,.4);
  p.elR.rotation.x=lerp(p.elR.rotation.x,-(.20+.85*mv)*moving-.10,.4);
  if(S.arm&&aw>0){
    applyArm(R,-1,S.arm,aw*.55);applyArm(R,1,S.arm,aw*.55);
  }
  /* wave oscillation */
  if(S.waveAmt){
    p.elR.rotation.z=Math.sin(tt*11)*.55*S.waveAmt;
    p.haR.rotation.z=Math.sin(tt*11+1)*.45*S.waveAmt;
  }else{p.haR.rotation.z=lerp(p.haR.rotation.z,0,.3);}

  /* head */
  const hp=(S.headPitch||0)+(S.crouch||0)*.10, hy=(S.headYaw||0);
  p.head.rotation.x=lerp(p.head.rotation.x,hp-lean*.45,.28);
  p.head.rotation.y=lerp(p.head.rotation.y,hy+(S.headScan?Math.sin(tt*.85)*.55*S.headScan:0),.22);
  p.head.rotation.z=lerp(p.head.rotation.z,(S.headTilt||0)+Math.sin(tt*1.1)*.012,.2);
  p.eyeL.rotation.y=p.eyeR.rotation.y=lerp(p.eyeL.rotation.y,p.head.rotation.y*.35,.3);
  p.eyeL.rotation.x=p.eyeR.rotation.x=lerp(p.eyeL.rotation.x,-p.head.rotation.x*.30,.3);

  /* expression */
  const e=EX[S.expr]||EX.neutral,k=.16;
  p.browL.rotation.z=lerp(p.browL.rotation.z,e.bl,k);
  p.browR.rotation.z=lerp(p.browR.rotation.z,-e.br,k);
  p.browL.position.y=lerp(p.browL.position.y,.180+e.by,k);
  p.browR.position.y=lerp(p.browR.position.y,.180+e.by,k);
  p.mouth.scale.x=lerp(p.mouth.scale.x,e.msx,k);
  p.mouth.scale.y=lerp(p.mouth.scale.y,e.msy,k);
  p.mouth.position.y=lerp(p.mouth.position.y,.052+e.my,k);
  const es=lerp(p.eyeL.scale.y,e.es,k);
  p.eyeL.scale.set(1,es,1);p.eyeR.scale.set(1,es,1);
}
function rig_sh(R){return R.base.shZ;}

/* freeze a rig into a static pose */
function staticPose(R,seed,kind){
  const ph=seed*Math.PI*2;
  if(kind==='fallen'||kind==='fallenFace'){
    const face=kind==='fallenFace';
    R.group.rotation.x=face?Math.PI/2:-Math.PI/2;
    R.group.rotation.z=rr(-.5,.5);
    R.group.position.y=face?.20:.19;
    const p=R.p;
    p.pelvis.rotation.x=.05;
    p.hpL.rotation.x=rr(-.5,.3);p.hpR.rotation.x=rr(-.6,.2);
    p.knL.rotation.x=rr(.1,1.0);p.knR.rotation.x=rr(.05,.7);
    p.shL.rotation.x=rr(-1.6,-.4);p.shR.rotation.x=rr(-1.6,-.4);
    p.shL.rotation.z=rr(-.9,-.3);p.shR.rotation.z=rr(.3,.9);
    p.elL.rotation.x=rr(-.9,-.1);p.elR.rotation.x=rr(-.9,-.1);
    p.head.rotation.z=rr(-.4,.4);p.head.rotation.x=face?-.2:.15;
    return;
  }
  const run=kind==='run';
  const amp=run?.95:.55,s=Math.sin(ph);
  const p=R.p;
  p.hpL.rotation.x=-s*amp;p.hpR.rotation.x=s*amp;
  p.knL.rotation.x=Math.max(0,s)*(run?1.35:.62)+.05;
  p.knR.rotation.x=Math.max(0,-s)*(run?1.35:.62)+.05;
  p.shL.rotation.x=s*(run?.95:.42);p.shR.rotation.x=-s*(run?.95:.42);
  p.elL.rotation.x=-(run?1.25:.42);p.elR.rotation.x=-(run?1.25:.42);
  p.shL.rotation.z=-.13-(run?.16:0);p.shR.rotation.z=.13+(run?.16:0);
  p.spine.rotation.x=run?.34:.06;p.spine.rotation.y=s*.10;
  p.pelvis.position.y=R.base.pelvisY+(run?.03:0)+Math.abs(Math.cos(ph))*.02;
  p.head.rotation.x=run?-.30:0;p.head.rotation.y=rr(-.35,.35);
  const ex=run?'scared':'neutral';
  const e=EX[ex];
  p.browL.rotation.z=e.bl;p.browR.rotation.z=-e.br;
  p.browL.position.y=p.browR.position.y=.180+e.by;
  p.mouth.scale.set(e.msx,e.msy,1);p.mouth.position.y=.052+e.my;
  p.eyeL.scale.y=p.eyeR.scale.y=e.es;
}

}

const NARR_CFG={rate:.97,pitch:.82,vol:1};
let voices=[],narrOn=true;
function pickVoice(){
  if(!window.speechSynthesis)return null;
  const vs=speechSynthesis.getVoices();if(!vs.length)return null;voices=vs;
  const pref=['Daniel','Google UK English Male','Microsoft David','Microsoft Guy','Alex','Fred','Arthur',
    'Microsoft Mark','Google US English','Rishi','Oliver','Tom','Male'];
  const en=vs.filter(v=>/^en/i.test(v.lang));
  for(const p of pref){const f=en.find(v=>v.name.includes(p));if(f)return f;}
  return en[0]||vs[0];
}
function speak(txt){
  if(!narrOn||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    const v=pickVoice();if(v)u.voice=v;
    u.rate=NARR_CFG.rate;u.pitch=NARR_CFG.pitch;u.volume=NARR_CFG.vol;u.lang=v?v.lang:'en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}

const _d=new THREE.Object3D();
let alexSpeed=0,alexPhase=0,lastAlexPos=new THREE.Vector3(),lastFigPhase=0,figPhase=0;
const alexWorld=new THREE.Vector3(),alexFace=new THREE.Vector2(0,-1);
let shakeAmt=0,shakeDecay=0;
function shake(a,d){shakeAmt=Math.max(shakeAmt,a);shakeDecay=d||.5;}

const GRADE={
  fogC0:new THREE.Color(0xa9bccd),fogC1:new THREE.Color(0x5f7288),
  sunC0:new THREE.Color(0xfff0d8),sunC1:new THREE.Color(0xc4d8f0),
  hemiS0:new THREE.Color(0xc3dcf5),hemiS1:new THREE.Color(0x7d97b8),
  hemiG0:new THREE.Color(0x4a4b45),hemiG1:new THREE.Color(0x1f2630),
  sky0:new THREE.Color(0xffffff),sky1:new THREE.Color(0x6f8299)
};
const tmpC=new THREE.Color();

function updateWorld(t){
  const fr=t>=FREEZE, tt=Math.min(t,FREEZE);
  const grade=clamp((t-FREEZE)/.75,0,1);
  const revK=clamp((t-REV)/1.6,0,1);

  /* ---- atmosphere grade ---- */
  scene.fog.color.copy(GRADE.fogC0).lerp(GRADE.fogC1,grade);
  scene.fog.density=lerp(.0052,.0165,grade)+revK*.006;
  sun.color.copy(GRADE.sunC0).lerp(GRADE.sunC1,grade);
  sun.intensity=lerp(1.18,.86,grade)+revK*.25;
  hemi.color.copy(GRADE.hemiS0).lerp(GRADE.hemiS1,grade);
  hemi.groundColor.copy(GRADE.hemiG0).lerp(GRADE.hemiG1,grade);
  hemi.intensity=lerp(.62,.46,grade);
  fill.intensity=lerp(.30,.44,grade);
  skyMat.color.copy(GRADE.sky0).lerp(GRADE.sky1,grade);
  renderer.toneMappingExposure=lerp(1.06,.98,grade)+revK*.10;

  /* ---- phones / billboard ---- */
  pScreen.material=fr?phoneTexAfter:phoneTexBefore;
  billboard.material=fr?bbAfter:bbBefore;

  /* ---- traffic lights ---- */
  [tl1,tl2].forEach((L,idx)=>{
    let r=0,a=0,g=0;
    if(!fr){
      const cyc=((tt*0.35)+idx*.33)%1;
      if(cyc<.5)g=1;else if(cyc<.62)a=1;else r=1;
    }else{
      r=.62;a=.58;g=0;                       // stuck between colours
      if(t>43.2){const fl=Math.random();r=fl<.5?1.4:.15;a=fl<.35?1.3:.1;g=fl>.86?1.2:0;}
    }
    L.lamps[0].emissiveIntensity=r*2.4;
    L.lamps[1].emissiveIntensity=a*2.4;
    L.lamps[2].emissiveIntensity=g*2.4;
  });

  /* ---- turning car ---- */
  (function(){
    const c=turnCar,d=c.R,sp=c.speed;
    const dist=sp*tt;
    let x,z,ry,steer=0;
    if(dist<c.d0){x=-3.5;z=30-dist;ry=Math.PI;}
    else{
      const phi=Math.min((dist-c.d0)/d,Math.PI/2);
      const cx=-3.5+d;
      x=cx-d*Math.cos(phi);z=14-d*Math.sin(phi);
      ry=Math.atan2(Math.sin(phi),-Math.cos(phi));
      steer=.55*(1-phi/(Math.PI/2));
    }
    c.g.position.set(x,ROADY,z);c.g.rotation.y=ry;
    const fwL=c.g.userData.fwL,fwR=c.g.userData.fwR;
    if(fwL)fwL.rotation.y=steer;if(fwR)fwR.rotation.y=steer;
    c.wx=x;c.wz=z;
  })();

  /* ---- other cars ---- */
  cars.forEach(c=>{
    if(!c.dir)return;
    const x=c.sx+c.dir[0]*c.sp*tt, z=c.sz+c.dir[1]*c.sp*tt;
    c.g.position.set(x,ROADY,z);
    c.g.rotation.y=c.ry;
    c.wx=x;c.wz=z;
  });

  /* ---- cyclist ---- */
  (function(){
    const z=cyclist.z0-cyclist.sp*tt;
    cyclist.g.position.set(cyclist.x,ROADY,z);
    cyclist.g.userData.wheel=cyclist.g.userData.wheel;
    const b=cyclist.g.children[0];
    if(b.userData.wheels)b.userData.wheels.forEach(w=>w.rotation.x=-(z*2.6));
  })();

  /* ---- pedestrians (frozen mid-step, absolutely static) ---- */
  peds.forEach(p=>{
    if(p.fixed)return;
    const x=p.sx+p.dir[0]*p.spd*tt, z=p.sz+p.dir[1]*p.spd*tt;
    p.R.group.position.set(x,groundAt(x,z),z);
  });

  /* ---- birds ---- */
  birds.forEach((b,i)=>{
    if(!fr){
      const x=b.sx+b.dir*b.sp*tt, z=b.sz-b.sp*.35*tt, y=b.y+Math.sin(tt*2+b.ph)*.35;
      b.g.position.set(x,y,z);
      const flap=Math.sin(tt*11+b.ph)*.85;
      b.g.userData.wl.rotation.z=flap;b.g.userData.wr.rotation.z=-flap;
      b.g.rotation.y=b.dir>0?-Math.PI/2:Math.PI/2;
      b.g.rotation.z=Math.sin(tt*2+b.ph)*.08;
    }
  });

  /* ---- leaves ---- */
  (function(){
    if(fr&&t<REV+0.001&&!leafIM.userData.dirty){return;}
    for(let i=0;i<LEAVES;i++){
      const L=leafData[i];let y,rot;
      if(!fr){y=L.y0-L.vy*tt;rot=tt*1.6+L.ph;}
      else if(t<REV){y=L.y0-L.vy*FT;rot=FT*1.6+L.ph;}
      else{const k=(t-REV);y=(L.y0-L.vy*FT)+k*k*3.4+k*2.2;rot=FT*1.6+L.ph-k*4;}
      y=((y%16)+16)%16;
      const x=L.x+Math.sin(rot*.7)*L.sw*(fr&&t<REV?1:1);
      const z=L.z+Math.cos(rot*.5)*L.sw*.6;
      _d.position.set(x,y,z);_d.rotation.set(rot*.9,rot,rot*.4);_d.scale.setScalar(1);
      _d.updateMatrix();leafIM.setMatrixAt(i,_d.matrix);
    }
    leafIM.instanceMatrix.needsUpdate=true;
  })();

  /* ---- rain ---- */
  (function(){
    const moving=(!fr)||(t>=REV);
    if(!moving&&dropIM.userData.settled)return;
    for(let i=0;i<NDROP;i++){
      const D=drops[i];let y,sy=1;
      if(!fr){y=D.y0-D.v*tt;}
      else if(t<REV){y=D.y0-D.v*FT;}
      else{const k=t-REV;y=(D.y0-D.v*FT)+k*k*4.2+k*2.4;sy=1.7;}
      y=((y%32)+32)%32;
      _d.position.set(D.x,y,D.z);_d.rotation.set(0,0,0);_d.scale.set(1,sy,1);_d.updateMatrix();
      dropIM.setMatrixAt(i,_d.matrix);
    }
    dropIM.instanceMatrix.needsUpdate=true;
    dropIM.userData.settled=fr&&t<REV;
    dropIM.visible=true;
  })();

  /* ---- ALEX ---- */
  const w=sampleWP(t),ps=samplePose(t);
  const gy=groundAt(w.x,w.z);
  const nx=w.x,ny=gy,nz=w.z;
  alex.group.position.lerp(new THREE.Vector3(nx,ny,nz),1);
  alexWorld.set(nx,ny,nz);
  alexFace.set(w.f[0],w.f[1]);
  const targetA=Math.atan2(w.f[0],w.f[1]);
  let da=targetA-alex.group.rotation.y;
  while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  alex.group.rotation.y+=da*.22;

  /* speed & phase from real travelled distance -> no foot sliding */
  const dx=nx-lastAlexPos.x,dz=nz-lastAlexPos.z;
  let dtf=Math.max(1/240,lastDT);
  const dist=Math.hypot(dx,dz);
  const sp=dist/dtf;
  alexSpeed=lerp(alexSpeed,Math.min(sp,7),.35);
  const stride=alexSpeed>2.6?1.55:.82;
  alexPhase+=dist/stride*Math.PI*2;
  lastAlexPos.set(nx,ny,nz);
  if(ps.crouch>.5)alexPhase=alexPhase; /* keep */

  const armDef=ARM[ps.arm]||ARM.down;
  poseRig(alex.group.userData.rig||alexRigRef,{
    speed:alexSpeed*(ps.crouch>.5?.25:1),phase:alexPhase,arm:armDef,armW:ps.aw,
    expr:ps.expr,headPitch:ps.hp,headYaw:ps.hy,headScan:ps.scan,crouch:ps.crouch,
    waveAmt:ps.wave,lean:ps.lean
  },t);

  /* ---- FIGURE ---- */
  const fw=sampleFig(t);
  fig.group.visible=(t>=18.6);
  if(fig.group.visible){
    const fgy=groundAt(fw.x,fw.z);
    fig.group.position.set(fw.x,fgy,fw.z);
    const ta=Math.atan2(fw.f[0],fw.f[1]);
    let d2=ta-fig.group.rotation.y;while(d2>Math.PI)d2-=Math.PI*2;while(d2<-Math.PI)d2+=Math.PI*2;
    fig.group.rotation.y+=d2*.12;
    const fdist=Math.hypot(fw.x-lastFig.x,fw.z-lastFig.z);
    figPhase+=fdist/1.05*Math.PI*2;
    lastFig.set(fw.x,fw.z);
    const isStep=(t>=25.4&&t<27.0)||(t>=37.6&&t<39.0);
    poseRig(figRigRef,{
      speed:isStep?Math.min(fdist/Math.max(1/240,lastDT),1.2):0,
      phase:figPhase,arm:ARM[fw.arm],armW:1,expr:'blank',
      headPitch:(t>=42.9?-.55:0)+(t>=22.2&&t<25.4?-.05:0),
      headYaw:(t>=22.2?.18:0),headScan:0,crouch:0,lean:isStep?.10:0,waveAmt:0
    },t);
    fig.setReveal(clamp(fw.rev,0,1));
    /* subtle unnatural sway only while unrevealed */
    if(fw.rev<.5)fig.p.spine.rotation.z=Math.sin(t*.7)*.012;
  }
  /* reveal light */
  revealLight.intensity=clamp((t-37.4)/1.4,0,1)*2.4*(1+Math.sin(t*3.1)*.05);

  /* ---- hero droplet position (aligned to Alex's reaching hand) ---- */
  heroDrop.visible=(t>=9.4&&t<12.4)||(t>=REV);
  heroDrop.position.copy(heroDropPos);
  if(t>=REV){const k=t-REV;heroDrop.position.y=heroDropPos.y+k*k*3.6+k*2.0;}

  /* ---- car door ---- */
  const dk=clamp((t-13.95)/.85,0,1);
  heroCar.door.rotation.y=-easeO(dk)*1.02;

  /* ---- shadow rig follows action ---- */
  const focus=(t>18.5&&t<27.2)?new THREE.Vector3(lerp(alexWorld.x,-1,.35),0,lerp(alexWorld.z,-30,.35)):alexWorld;
  sun.position.set(focus.x+30,focus.y+46,focus.z+20);
  sun.target.position.set(focus.x,focus.y,focus.z);
  sun.target.updateMatrixWorld();
}
const lastFig=new THREE.Vector3(-1,-70);

/* rig refs (poseRig expects {p:...}) */
const alexRigRef={p:alex.p,base:alex.base};
const figRigRef={p:fig.p,base:fig.base};

/* place hero droplet exactly at Alex's fingertip at touch time */
const heroDropPos=new THREE.Vector3();
(function(){
  const t=11.0,w=sampleWP(t),ps=samplePose(t);
  alex.group.position.set(w.x,groundAt(w.x,w.z),w.z);
  alex.group.rotation.y=Math.atan2(w.f[0],w.f[1]);
  poseRig(alexRigRef,{speed:0,phase:0,arm:ARM.reach,armW:1,expr:'focused',
    headPitch:ps.hp,headYaw:0,headScan:0,crouch:0,waveAmt:0,lean:null},0);
  alex.group.updateMatrixWorld(true);
  const hp=new THREE.Vector3();alex.p.haR.getWorldPosition(hp);
  const fwd=new THREE.Vector3(Math.sin(alex.group.rotation.y),0,Math.cos(alex.group.rotation.y));
  heroDropPos.copy(hp).addScaledVector(fwd,.10).add(new THREE.Vector3(0,-.045,0));
  /* reset to neutral */
  alex.group.position.set(8.6,groundAt(8.6,24.9),24.9);
})();

/* =========================================================================
   14. CAMERA DRIVER
   ========================================================================= */
const camPos=new THREE.Vector3(),camTgt=new THREE.Vector3();
let lastFov=46;
function updateCamera(t){
  let s=SHOTS[0];
  for(const sh of SHOTS){if(t>=sh.a&&t<sh.b){s=sh;break;}if(t>=sh.b)s=sh;}
  const u=clamp((t-s.a)/Math.max(.001,(s.b-s.a)),0,1),e=easeIO(u);
  const p0=V3(s.p0),p1=V3(s.p1),g0=V3(s.g0),g1=V3(s.g1);
  if(s.m==='r'){
    const a=alex.group.rotation.y;
    const R=new THREE.Vector3(Math.cos(a),0,-Math.sin(a));
    const F=new THREE.Vector3(Math.sin(a),0,Math.cos(a));
    const U=new THREE.Vector3(0,1,0);
    const mk=(v)=>new THREE.Vector3().copy(alexWorld)
      .addScaledVector(R,v[0]).addScaledVector(U,v[1]).addScaledVector(F,v[2]);
    camPos.copy(mk(p0)).lerp(mk(p1),e);
    camTgt.copy(mk(g0)).lerp(mk(g1),e);
  }else{
    camPos.copy(p0).lerp(p1,e);camTgt.copy(g0).lerp(g1,e);
  }
  /* handheld + shake */
  const sh=(s.sh||0)*shakeAmt+0.0055;
  camPos.x+=Math.sin(t*17.3)*sh*.55+Math.sin(t*3.1)*sh*.4;
  camPos.y+=Math.sin(t*13.7+1.2)*sh*.45+Math.cos(t*2.3)*sh*.3;
  camPos.z+=Math.cos(t*15.1+.6)*sh*.55;
  if(camPos.y<0.35)camPos.y=0.35;
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
  camera.rotation.z+=Math.sin(t*7.3)*sh*.06;
  const fov=lerp(s.f0,s.f1,e);
  if(Math.abs(fov-lastFov)>.001){camera.fov=fov;camera.updateProjectionMatrix();lastFov=fov;}
}

/* =========================================================================
   15. PLAYER
   ========================================================================= */
let T=0,playing=false,lastStamp=0,lastDT=1/30;
const el={
  subs:document.getElementById('subsText'),flash:document.getElementById('flash'),
  black:document.getElementById('black'),grade:document.getElementById('grade'),
  cool:document.getElementById('cool'),bar:document.getElementById('barFill'),
  tc:document.getElementById('tcode'),hud:document.getElementById('hud')
};
let curSub=null,subToken=0;
function setSub(cue){
  if(curSub===cue)return;
  curSub=cue;const tk=++subToken;
  el.subs.classList.remove('show');
  if(!cue){return;}
  setTimeout(()=>{if(tk!==subToken)return;
    el.subs.textContent=cue.t;el.subs.classList.toggle('em',!!cue.em);
    el.subs.classList.add('show');},70);
}
function fireCues(seek){
  NARR.forEach(n=>{if(!n.done&&T>=n.t){n.done=true;if(!seek&&playing)n.f();}});
  EV.forEach(n=>{if(!n.done&&T>=n.t){n.done=true;if(!seek)n.f();}});
}
function markCues(){NARR.forEach(n=>n.done=n.t<=T);EV.forEach(n=>n.done=n.t<=T);}
function seek(t){T=clamp(t,0,DUR);markCues();setSub(null);curSub=null;step(0,true);}

let flashState=0;
function step(dt,seek){
  /* subtitles */
  let act=null;for(const s of SUBS){if(T>=s.a&&T<=s.b){act=s;break;}}
  if(T>BLACKT)act=null;
  setSub(act);

  updateWorld(T);
  updateCamera(T);

  /* shake decay */
  shakeAmt=Math.max(0,shakeAmt-dt/(shakeDecay||.5));

  /* footsteps driven by real gait */
  if(!seek){
    const stp=Math.floor(alexPhase/Math.PI);
    if(stp!==lastStep&&alexSpeed>.45&&T<BLACKT){
      lastStep=stp;SFX.step(clamp(.45+alexSpeed*.16,.4,1.35));
    }
    const fst=Math.floor(figPhase/Math.PI);
    if(fst!==lastFigStep&&fig.group.visible){
      lastFigStep=fst;
      if((T>=25.4&&T<27.0)||(T>=37.6&&T<39.0))SFX.thud(.55);
    }
  }

  /* overlays */
  const gr=clamp((T-FREEZE)/.75,0,1);
  el.grade.style.opacity=(gr*.95).toFixed(3);
  el.cool.style.opacity=(gr*.85).toFixed(3);
  el.bar.style.width=(T/DUR*100).toFixed(2)+'%';
  const mm=String(Math.floor(T/60)).padStart(2,'0'),ss=String(Math.floor(T%60)).padStart(2,'0');
  el.tc.textContent=`${mm}:${ss} / 00:48`;

  /* flash + black */
  if(T>=FLASHT&&flashState===0){flashState=1;el.flash.style.transition='opacity .05s linear';el.flash.style.opacity='1';}
  if(T>=BLACKT&&flashState===1){flashState=2;
    el.flash.style.transition='opacity .10s linear';el.flash.style.opacity='0';
    el.black.style.transition='opacity .06s linear';el.black.style.opacity='1';}
  if(T<FLASHT&&flashState!==0){flashState=0;
    el.flash.style.transition='none';el.flash.style.opacity='0';
    el.black.style.transition='none';el.black.style.opacity='0';}

  /* mirror render only when needed */
  const needMirror=(T>=33.55&&T<35.2);
  if(mirrorMesh)mirrorMesh.material=needMirror?mirrorMat:glassMat;
}
let lastStep=-1,lastFigStep=-1;

function frame(stamp){
  requestAnimationFrame(frame);
  if(!lastStamp)lastStamp=stamp;
  let dt=(stamp-lastStamp)/1000;lastStamp=stamp;
  dt=Math.min(dt,.05);lastDT=dt||1/60;
  if(playing){
    T+=dt;
    if(T>=DUR){T=DUR;playing=false;setPlayIcon();}
    fireCues(false);
  }
  step(dt,false);
  /* reflection pass */
  if(mirrorMesh&&mirrorMesh.material===mirrorMat){
    const wp=new THREE.Vector3();mirrorMesh.getWorldPosition(wp);
    const nrm=new THREE.Vector3(1,0,0).applyQuaternion(mirrorMesh.getWorldQuaternion(new THREE.Quaternion()));
    mirrorCam.position.copy(wp).addScaledVector(nrm,.06);
    mirrorCam.aspect=mirrorRT.width/mirrorRT.height;mirrorCam.fov=52;mirrorCam.updateProjectionMatrix();
    const fs=sampleFig(T);
    mirrorCam.lookAt(fs.x,1.42,fs.z);
    mirrorMesh.visible=false;
    renderer.setRenderTarget(mirrorRT);renderer.render(scene,mirrorCam);
    renderer.setRenderTarget(null);mirrorMesh.visible=true;
  }
  renderer.render(scene,camera);
}

/* =========================================================================
   16. LAYOUT / UI
   ========================================================================= */
function layout(){
  const vw=innerWidth,vh=innerHeight;
  let w,h;
  if(vw/vh>9/16){h=vh;w=Math.round(h*9/16);}else{w=vw;h=Math.round(w*16/9);}
  stage.style.width=w+'px';stage.style.height=h+'px';
  document.documentElement.style.setProperty('--sw',w+'px');
  document.documentElement.style.setProperty('--sh',h+'px');
  renderer.setSize(w,h,false);
  camera.aspect=9/16;camera.updateProjectionMatrix();
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
layout();

function setPlayIcon(){document.getElementById('btnPlay').textContent=playing?'❚❚':'▶';}
let hudTimer=null;
function showHud(){
  el.hud.classList.add('on');clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{if(playing)el.hud.classList.remove('on');},2400);
}
addEventListener('pointermove',showHud);addEventListener('touchstart',showHud,{passive:true});

document.getElementById('btnPlay').onclick=()=>{
  playing=!playing;
  if(playing){SFX.resume();if(T>=DUR)seek(0);}else{if(window.speechSynthesis)speechSynthesis.cancel();}
  setPlayIcon();showHud();
};
document.getElementById('btnRestart').onclick=()=>{restart();showHud();};
document.getElementById('btnSound').onclick=(e)=>{
  SFX.setOn(!SFX.on);narrOn=SFX.on;
  e.currentTarget.textContent=SFX.on?'🔊':'🔇';
  if(!narrOn&&window.speechSynthesis)speechSynthesis.cancel();
  showHud();
};
document.getElementById('btnFs').onclick=()=>{
  if(!document.fullscreenElement)(document.documentElement.requestFullscreen||(()=>{})).call(document.documentElement);
  else document.exitFullscreen&&document.exitFullscreen();
  showHud();
};
document.getElementById('bar').addEventListener('pointerdown',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  seek(((e.clientX-r.left)/r.width)*DUR);showHud();
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();document.getElementById('btnPlay').click();}
  if(e.code==='KeyR')restart();
  if(e.code==='ArrowRight')seek(T+2);
  if(e.code==='ArrowLeft')seek(T-2);
});

function restart(){
  T=0;markCues();curSub=null;setSub(null);
  flashState=0;el.flash.style.opacity='0';el.black.style.opacity='0';
  shakeAmt=0;alexPhase=0;figPhase=0;lastStep=-1;lastFigStep=-1;
  lastAlexPos.set(8.6,groundAt(8.6,24.9),24.9);lastFig.set(-1,-70);
  alexSpeed=0;
  if(window.speechSynthesis)speechSynthesis.cancel();
  SFX.killAll();setTimeout(()=>{if(SFX.master)SFX.master.gain.value=SFX.on?1:0;},120);
  playing=true;setPlayIcon();
}

/* ---------- gate ---------- */
document.getElementById('btnStart').onclick=()=>{
  SFX.init();SFX.resume();
  if(window.speechSynthesis){pickVoice();
    try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}
    speechSynthesis.onvoiceschanged=pickVoice;}
  const fs=document.documentElement.requestFullscreen;
  if(fs){try{const p=fs.call(document.documentElement);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  if(screen.orientation&&screen.orientation.lock){try{screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}
  document.getElementById('gate').classList.add('hide');
  setTimeout(()=>{document.getElementById('gate').style.display='none';},520);
  restart();showHud();
};

/* ---------- boot ---------- */
lastAlexPos.set(8.6,groundAt(8.6,24.9),24.9);
updateWorld(0);updateCamera(0);
renderer.render(scene,camera);
requestAnimationFrame(frame);
</script>
</body>
</html>
